version: 2
# Both ecosystems prefix their commit subjects with `chore(deps)`.
# mk/changelog.mk finds a release window's dependency bumps by grepping
# the commit log for CHANGELOG_DEPS_GREP, which defaults to that prefix;
# without it `make changelog-deps` reports zero bumps and they silently
# miss the release notes. If the prefix changes here, change it there.
updates:
  # Go modules. Nothing is held back any more: the go directive is 1.25.0,
  # which is what x/net, x/text and gomega each require, so Dependabot PRs
  # for them can be taken on their merits.
  #
  # A dependency that raises its own go directive above this floor is still
  # a breaking change for consumers, so check the `go` line in any proposed
  # bump before merging it.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Workflow actions do not update themselves. They are pinned to commit
  # SHAs, which makes every upstream release an update rather than only
  # major bumps — grouped so they arrive as one weekly PR instead of one
  # PR per action.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keeps the declared go 1.18 floor honest. Compile only: this leg runs an
  # old toolchain deliberately, so no test, lint, or vulnerability scan runs
  # here — they would report that toolchain's stdlib advisories, which say
  # nothing about this code.
  build-floor:
    name: Build at go directive floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.18"
      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: make test-race
      - run: make cover

  check:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - run: make fmt vet tidy

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # gitleaks scans git history, so a depth-1 checkout would leave it
          # inspecting a single commit and reporting clean regardless.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # govulncheck, gosec and modrot are go install'ed on demand by
      # mk/security.mk. gitleaks is a system package, so it is the one
      # scanner a plain runner has to be given.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/${tarball}"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${tarball}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" gitleaks
          gitleaks version
      - run: make audit
        env:
          # modrot queries the GitHub API to detect archived dependencies.
          # Without a token it cannot authenticate and the target fails.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

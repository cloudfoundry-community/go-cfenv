name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keeps the declared go 1.25 floor honest. Compile only: this leg runs an
  # old toolchain deliberately, so no test, lint, or vulnerability scan runs
  # here — they would report that toolchain's stdlib advisories, which say
  # nothing about this code.
  build-floor:
    name: Build at go directive floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make test-race
      - run: make cover

  check:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - run: make fmt vet tidy
      # These workflow files are the one thing here that CI cannot catch by
      # failing: a bad action ref or a duplicate key breaks the run itself.
      # `make check` includes this, but this job runs the gates individually
      # because golangci-lint comes from the action above rather than `make
      # lint` — so actionlint has to be listed here too.
      - run: make actionlint
      # Catches a stub or malformed release-notes fragment before it can
      # silently drop out of the assembled notes at release time.
      - run: make changelog-check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # gitleaks scans git history, so a depth-1 checkout would leave it
          # inspecting a single commit and reporting clean regardless.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # govulncheck, gosec and modrot are go install'ed on demand by
      # mk/security.mk. gitleaks is a system package, so it is the one
      # scanner a plain runner has to be given; the snippet fetches a
      # pinned release and verifies it against the published checksums.
      - name: Install gitleaks
        run: |
          make install-gitleaks
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - run: make audit
        env:
          # modrot queries the GitHub API to detect archived dependencies.
          # Without a token it cannot authenticate and the target fails.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
